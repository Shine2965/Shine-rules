<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐉 Dragon CS - Telegram Bridge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            background: #1a1a1a;
            border-radius: 24px;
            border: 2px solid #ff4444;
            box-shadow: 0 0 40px rgba(255, 68, 68, 0.3);
            overflow: hidden;
            position: relative;
        }

        .chat-header {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff6666;
        }

        .chat-header .title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header .title h1 {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
        }

        .chat-header .title .status {
            width: 12px;
            height: 12px;
            background: #00ff88;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            box-shadow: 0 0 20px #00ff88;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .chat-header .badge {
            background: rgba(255,255,255,0.2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #fff;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .chat-body {
            height: 450px;
            overflow-y: auto;
            padding: 20px;
            background: #121212;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .chat-body::-webkit-scrollbar {
            width: 6px;
        }

        .chat-body::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .chat-body::-webkit-scrollbar-thumb {
            background: #ff4444;
            border-radius: 10px;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            border: 1px solid #333;
        }

        .message.cs {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: #fff;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message .time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 6px;
            display: block;
            text-align: right;
        }

        .message.cs .time {
            text-align: left;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: #2a2a2a;
            padding: 10px 18px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            gap: 6px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #ff4444;
            border-radius: 50%;
            display: inline-block;
            animation: typing 1.2s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        .chat-footer {
            padding: 16px 20px;
            background: #1a1a1a;
            border-top: 2px solid #2a2a2a;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .chat-footer input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #2a2a2a;
            border-radius: 30px;
            background: #0d0d0d;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .chat-footer input:focus {
            border-color: #ff4444;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.2);
        }

        .chat-footer input::placeholder {
            color: #555;
        }

        .chat-footer button {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            border: none;
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .chat-footer button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 68, 68, 0.5);
        }

        .chat-footer button:active {
            transform: scale(0.95);
        }

        .chat-footer button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .toolbar {
            display: flex;
            gap: 6px;
            padding: 8px 20px;
            background: #0d0d0d;
            border-top: 1px solid #1a1a1a;
            justify-content: space-between;
            align-items: center;
        }

        .toolbar .status-text {
            color: #888;
            font-size: 11px;
        }

        .toolbar .status-text.online {
            color: #00ff88;
        }

        .toolbar .status-text.offline {
            color: #ff4444;
        }

        .toolbar button {
            background: none;
            border: none;
            color: #888;
            font-size: 12px;
            padding: 4px 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        .toolbar button:hover {
            color: #ff4444;
        }

        .toolbar .export-btn {
            color: #00ff88;
        }

        .connection-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .connection-status.online {
            background: #00ff8822;
            color: #00ff88;
            border: 1px solid #00ff8844;
        }

        .connection-status.offline {
            background: #ff444422;
            color: #ff4444;
            border: 1px solid #ff444444;
        }

        @media (max-width: 600px) {
            .chat-container { max-width: 100%; border-radius: 16px; }
            .chat-header .title h1 { font-size: 16px; }
            .chat-body { height: 350px; padding: 16px; }
            .chat-footer { padding: 12px 16px; flex-wrap: wrap; }
            .chat-footer button { width: 100%; }
            .toolbar { flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- HEADER -->
        <div class="chat-header">
            <div class="title">
                <div class="status" id="statusDot"></div>
                <h1>🐉 Dragon CS</h1>
            </div>
            <div class="badge" id="connectionBadge">🔄 CONNECTING</div>
        </div>

        <!-- CHAT BODY -->
        <div class="chat-body" id="chatBody">
            <div class="message cs">
                🔥 Hai! Gue Dragon CS, siap bantu kapan aja. Ada yang bisa gue bantuin?
                <span class="time">Now</span>
            </div>
        </div>

        <!-- TYPING INDICATOR -->
        <div class="typing-indicator" id="typingIndicator">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- FOOTER -->
        <div class="chat-footer">
            <input type="text" id="messageInput" placeholder="Ketik pesan... 🔥" />
            <button id="sendBtn">Kirim</button>
        </div>

        <!-- TOOLBAR -->
        <div class="toolbar">
            <div>
                <span class="status-text" id="statusText">🔗 Menghubungkan...</span>
                <span class="connection-status offline" id="connStatus">OFFLINE</span>
            </div>
            <div>
                <button class="export-btn" id="exportChat">📥 Export Chat</button>
                <button id="clearChat">🗑️ Clear</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // DRAGON TELEGRAM BRIDGE - FULL REAL-TIME CHAT
        // ============================================================

        // ====== KONFIGURASI ======
        const SERVER_URL = 'https://your-server.com'; // GANTI DENGAN SERVER LU!
        const BOT_USERNAME = 'YourBotUsername'; // GANTI DENGAN USERNAME BOT LU!

        // ====== SESSION MANAGEMENT ======
        const SESSION_ID = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        let lastMessageId = 0;
        let isPolling = false;
        let reconnectAttempts = 0;
        const MAX_RECONNECT = 10;

        // ====== DOM REFS ======
        const chatBody = document.getElementById('chatBody');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const statusText = document.getElementById('statusText');
        const connStatus = document.getElementById('connStatus');
        const statusDot = document.getElementById('statusDot');
        const connectionBadge = document.getElementById('connectionBadge');

        // ====== AUDIO NOTIFICATION ======
        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 800;
                gain.gain.value = 0.1;
                osc.start();
                setTimeout(() => { osc.stop(); ctx.close(); }, 100);
            } catch(e) {}
        }

        // ====== UI FUNCTIONS ======
        function addMessage(text, sender = 'user') {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + 
                            now.getMinutes().toString().padStart(2, '0');
            div.innerHTML = `${text} <span class="time">${timeStr}</span>`;
            chatBody.appendChild(div);
            chatBody.scrollTop = chatBody.scrollHeight;
            if (sender === 'cs') playBeep();
        }

        function showTyping() {
            typingIndicator.style.display = 'flex';
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function hideTyping() {
            typingIndicator.style.display = 'none';
        }

        function setConnectionStatus(online) {
            if (online) {
                statusText.textContent = '✅ Terhubung ke Telegram';
                statusText.className = 'status-text online';
                connStatus.textContent = 'ONLINE';
                connStatus.className = 'connection-status online';
                statusDot.style.background = '#00ff88';
                statusDot.style.boxShadow = '0 0 20px #00ff88';
                connectionBadge.textContent = '🛡️ LIVE';
                connectionBadge.style.background = 'rgba(0,255,136,0.2)';
                connectionBadge.style.borderColor = 'rgba(0,255,136,0.3)';
                sendBtn.disabled = false;
            } else {
                statusText.textContent = '⛔ Terputus - Mencoba ulang...';
                statusText.className = 'status-text offline';
                connStatus.textContent = 'OFFLINE';
                connStatus.className = 'connection-status offline';
                statusDot.style.background = '#ff4444';
                statusDot.style.boxShadow = '0 0 20px #ff4444';
                connectionBadge.textContent = '⛔ OFFLINE';
                connectionBadge.style.background = 'rgba(255,68,68,0.2)';
                connectionBadge.style.borderColor = 'rgba(255,68,68,0.3)';
                sendBtn.disabled = true;
            }
        }

        // ====== TELEGRAM BRIDGE API ======
        async function registerSession() {
            try {
                const response = await fetch(`${SERVER_URL}/register-session`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId: SESSION_ID })
                });
                const data = await response.json();
                console.log('📡 Session registered:', data);
                return data.success;
            } catch(e) {
                console.error('❌ Gagal register session:', e);
                return false;
            }
        }

        async function sendMessageToServer(text) {
            try {
                const response = await fetch(`${SERVER_URL}/send-message`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        sessionId: SESSION_ID, 
                        message: text 
                    })
                });
                const data = await response.json();
                return data.success;
            } catch(e) {
                console.error('❌ Gagal kirim pesan:', e);
                return false;
            }
        }

        async function pollMessages() {
            if (isPolling) return;
            isPolling = true;

            try {
                const response = await fetch(
                    `${SERVER_URL}/get-messages/${SESSION_ID}?lastId=${lastMessageId}`
                );
                const data = await response.json();
                
                if (data.messages && data.messages.length > 0) {
                    data.messages.forEach(msg => {
                        if (msg.sender === 'cs') {
                            addMessage(msg.text, 'cs');
                        }
                    });
                    lastMessageId = data.lastId;
                }

                // Update status koneksi
                setConnectionStatus(true);
                reconnectAttempts = 0;
            } catch(e) {
                console.error('❌ Polling error:', e);
                setConnectionStatus(false);
                reconnectAttempts++;
                
                if (reconnectAttempts > MAX_RECONNECT) {
                    statusText.textContent = '💀 Gagal konek. Refresh halaman.';
                }
            } finally {
                isPolling = false;
            }
        }

        // ====== SEND MESSAGE HANDLER ======
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            // Tampilkan di UI
            addMessage(text, 'user');
            messageInput.value = '';
            messageInput.focus();

            // Kirim ke server
            const success = await sendMessageToServer(text);
            if (!success) {
                addMessage('⚠️ Gagal mengirim pesan. Coba lagi.', 'cs');
            }
        }

        // ====== GENERATE ADMIN LINK ======
        function getAdminLink() {
            return `https://t.me/${BOT_USERNAME}?start=${SESSION_ID}`;
        }

        // ====== INIT ======
        async function init() {
            // Tampilkan link admin di console
            console.log('🐉 DRAGON TELEGRAM BRIDGE ACTIVE');
            console.log('📋 SESSION ID:', SESSION_ID);
            console.log('🔗 LINK UNTUK ADMIN:');
            console.log(getAdminLink());
            console.log('📱 Kirim link ini ke admin untuk mulai chat!');

            // Register session
            const registered = await registerSession();
            if (registered) {
                setConnectionStatus(true);
                addMessage('✅ Terhubung ke Telegram! Admin akan merespon.', 'cs');
                addMessage(`📱 Kirim link ini ke admin: ${getAdminLink()}`, 'cs');
            } else {
                setConnectionStatus(false);
                addMessage('⚠️ Gagal terhubung ke server. Coba refresh.', 'cs');
            }

            // Mulai polling
            setInterval(pollMessages, 2000);
            
            // Polling pertama
            setTimeout(pollMessages, 500);
        }

        // ====== EVENT LISTENERS ======
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Export chat
        document.getElementById('exportChat').addEventListener('click', () => {
            const messages = chatBody.querySelectorAll('.message');
            let log = '=== DRAGON CS CHAT LOG ===\n';
            log += `Session: ${SESSION_ID}\n`;
            log += `Tanggal: ${new Date().toLocaleString()}\n\n`;
            messages.forEach(msg => {
                const sender = msg.classList.contains('user') ? 'User' : 'CS';
                const text = msg.textContent.replace(/\d{2}:\d{2}$/, '').trim();
                log += `[${sender}] ${text}\n`;
            });
            log += '\n=== END LOG ===';
            const blob = new Blob([log], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `chat_log_${Date.now()}.txt`;
            link.click();
        });

        // Clear chat
        document.getElementById('clearChat').addEventListener('click', () => {
            if (confirm('Yakin mau hapus semua chat, bos?')) {
                chatBody.innerHTML = '';
                addMessage('🗑️ Chat dibersihkan. Mulai lagi!', 'cs');
            }
        });

        // ====== START ======
        messageInput.focus();
        init();
    </script>
</body>
</html>
